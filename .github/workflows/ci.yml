name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
          diagnostic-endpoint: ''
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: systemstart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
      - run: nix develop --command make lint

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
          diagnostic-endpoint: ''
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: systemstart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
      - run: nix develop --command make test
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          flags: cmd,oci
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
          diagnostic-endpoint: ''
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: systemstart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
      - run: nix develop --command make build

  # `make release` only ever runs on a tag, so a broken .goreleaser.yaml or
  # cliff.toml would surface *after* the tag is pushed -- leaving a tag with no
  # release. Exercise both config files on every push instead. This is
  # deliberately not in `release`'s `needs`: `make release` runs git-cliff
  # itself and aborts before publishing if it fails, so this is early warning,
  # not a gate.
  release-check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # git-cliff needs the full history and the tags
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
          diagnostic-endpoint: ''
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: systemstart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
      - run: nix develop --command goreleaser check
      # Renders the release notes for the latest tag. Catches a broken template
      # or an unparseable cliff.toml; prints them to the log so a reviewer can
      # see what a release would say.
      - run: nix develop --command make release-notes

  # Reproducibility: two matrix legs run on separate fresh VMs (i.e. different
  # machines) and each records the manifest digest of the example image; the
  # compare job asserts they are identical. If the writer were nondeterministic,
  # the digests would diverge and this fails.
  reproducibility:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        instance: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
          diagnostic-endpoint: ''
      # Deliberately NO Cachix here. This job proves the image builds
      # identically on two independent machines; a shared binary cache would
      # serve leg 2 the artefact leg 1 pushed (or an artefact from an earlier
      # run), so both legs would report the same digest without either having
      # rebuilt anything. The check would pass unconditionally. cache.nixos.org
      # still supplies the nixpkgs dependencies — only the example image, the
      # thing under test, is built locally.
      - name: Build example image and record its manifest digest
        run: |
          img=$(nix build .#checks.x86_64-linux.exampleImage --no-link --print-out-paths)
          jq -r '.manifests[0].digest' "$img/index.json" > digest.txt
          cat digest.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-digest-${{ matrix.instance }}
          path: digest.txt

  reproducibility-compare:
    needs: reproducibility
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: digests
      - name: Assert the two machines produced the same digest
        run: |
          a=$(cat digests/repro-digest-1/digest.txt)
          b=$(cat digests/repro-digest-2/digest.txt)
          echo "instance 1: $a"
          echo "instance 2: $b"
          if [ "$a" != "$b" ]; then
            echo "::error::reproducibility failure: manifest digests differ across machines"
            exit 1
          fi
          echo "reproducible across machines: $a"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, build, reproducibility-compare]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
          diagnostic-endpoint: ''
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: systemstart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
      - run: nix develop --command make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the release page has notes
        # goreleaser exits 0 even when it publishes an empty body: `changelog:
        # disable: true` silently discarded the --release-notes file and shipped
        # nix-oci v0.5.0 with no notes at all. Assert the page instead of
        # trusting the exit code.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq '.body | length')
          echo "release body: $n characters"
          if [ "$n" -lt 200 ]; then
            echo "::error::release body is empty or truncated ($n chars) — the git-cliff notes did not reach the release page"
            exit 1
          fi
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/nix-oci_*"
